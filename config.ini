# This file contains default configuration settings for the Redfish Mockup Server
# All settings can be overridden by command-line arguments

[Server]
# The hostname or IP address to bind the server to
host = 127.0.0.1

# The port number to listen on
port = 8000

[Mockup]
# Path to the mockup directory (may be relative to current working directory)
# If not specified, the built-in public-rackmount1 mockup will be used
Dir = 

# Apply short form to mockup (omit filepath /redfish/v1)
# Set to true if the mockup does not contain the /redfish resource
short-form = false

[SSL]
# Place server in SSL (HTTPS) mode
ssl = false

# The certificate file for SSL (required if ssl = true)
cert = 

# The key file for SSL (required if ssl = true)
key = 

[Options]
# Load headers from headers.json files in the mockup
headers = false

# Delay in seconds added to all responses (float or int)
# Set to 0 for no delay
time = 0

# Delay response based on times in time.json files in mockup
timefromjson = false

# Enable etag testing (currently unimplemented)
test-etag = false

# Make mockup SSDP discoverable
ssdp = false
